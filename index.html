<!--
Embed leaderboards from a Google Sheet into any web page.
Results are imported as TSV files and displayed in a filterable table
(season, gender, course length, stroke). The actual HTML is loaded
dynamically from GitHub into an iframe.

Setup:
1. Publish your Google Sheets as TSV files and copy the links. Do the same for every season tab you want to include.
2. Paste the links into the KEYS object below. The key is the season name; the value is the TSV link.
More information and source code: https://github.com/nilskntl/dsv-club-leaderboards

Usage:
1. Create a new HTML file or embed this code into an element on your website.
2. Copy this file's contents into it.
3. Save the file and link to it from your site.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestenlisten</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
<iframe id="contentFrame" style="width: 100%; height: 100%; border: none"></iframe>
<script>

    /**
     * Visual and behaviour settings for the leaderboard embed.
     * Change any value and reload the page to see the effect.
     */
    const SETTINGS = {
        SHOW_STATISTICS: true,
        ROUNDED_CORNERS: true,
        TRANSITION_DURATION: '0.3s',
        PRIMARY_COLOR: '#31353E',
        SECONDARY_COLOR: '#424959',
        TERTIARY_COLOR: '#f2f4ef',
        CONTRAST_COLOR: '#ffffff',
        PRIMARY_BACKGROUND: '#f3f3f3',
        SECONDARY_BACKGROUND: '#ffffff'
    }

    /**
     * Links to your published Google Sheets in TSV format.
     * Add one entry per season following the same pattern.
     */
    const KEYS = {
        /**
         * Link Struktur
         * https://docs.google.com/spreadsheets/d/e/ID_OF_YOUR_SPREADHSEET/pub?gid=ID_OF_SPECIFIC_SHEET&single=true&output=tsv
         */
        'All-Time': {
            'name': 'All-Time', /** Do NOT change this name — it is used as a special key internally. */
            'link': 'LINK_TO_YOUR_SHEET_AS_TSV_FILE'
        },
        '2023': {
            'name': '2023',
            'link': 'LINK_TO_YOUR_SHEET_AS_TSV_FILE'
        },
        '2022': {
            'name': '2022',
            'link': 'LINK_TO_YOUR_SHEET_AS_TSV_FILE'
        }
    }

    /**
     * Loads the leaderboard HTML from GitHub and injects it into the iframe.
     */
    fetch('https://raw.githubusercontent.com/nilskntl/dsv-club-leaderboards/refs/tags/1.2.0/src/website/loadHtml.js')
        .then(response => response.text())
        .then(code => {
            eval(code);
            loadHtmlContent(KEYS, SETTINGS).then(htmlContent => {
                insertHtmlIntoContainer('contentFrame', htmlContent);
            });
        });
</script>
</body>
</html>
